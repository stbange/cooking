<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FatDuck — 3D First-Principles Culinary Lab</title>
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: #11151d; color: #e8eef8;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      overflow: hidden; touch-action: none;
    }
    #canvas {
      display: block; width: 100vw; height: 100vh; outline: none;
    }
    #loading {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 12px;
      background: radial-gradient(circle at 50% 40%, #1c2434 0%, #11151d 70%);
      z-index: 10; pointer-events: none; transition: opacity 0.3s ease;
    }
    #loading.hidden { opacity: 0; }
    .badge { color: #eba634; font-weight: 700; font-size: 1.5rem; letter-spacing: 0.02em; }
    .sub { color: #a8b8d2; font-size: 0.95rem; }
    .spinner {
      width: 34px; height: 34px; border-radius: 50%;
      border: 3px solid #2a3447; border-top-color: #eba634;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <div class="badge">FatDuck 3D Culinary Lab</div>
    <div class="sub">Loading external ./assets/, Noto typography &amp; 20 world languages...</div>
  </div>
  <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
  <script>
    var Module = {
      canvas: (function() { return document.getElementById('canvas'); })(),
      onRuntimeInitialized: function() {
        const resize = () => {
          const c = document.getElementById('canvas');
          c.width = window.innerWidth;
          c.height = window.innerHeight;
        };
        window.addEventListener('resize', resize);
        resize();
        const poll = setInterval(() => {
          if (Module._fd_web_get_state_json) {
            const st = JSON.parse(Module.UTF8ToString(Module._fd_web_get_state_json()));
            if (st.booted) {
              document.getElementById('loading').classList.add('hidden');
              clearInterval(poll);
            }
          }
        }, 100);
      }
    };
    window.fatduckDebugState = function() {
      if (!Module._fd_web_get_state_json) return null;
      return JSON.parse(Module.UTF8ToString(Module._fd_web_get_state_json()));
    };
    window.fatduckSetLang = function(code) {
      if (!Module._fd_web_set_lang) return;
      const p = Module.stringToNewUTF8(code);
      Module._fd_web_set_lang(p);
      Module._free(p);
    };
  </script>
  {{{ SCRIPT }}}
</body>
</html>
